briefing: |-
  Cap how much an account can send per day: a daily_limit column, a running total per day, a check before the debit.
  POST /transfers → Service.Transfer → limits.Check → Debit/Credit/AddSpent. A transfer over the limit gets 422.
  Watch: the check and the debit are not in one transaction; amounts arrive as floats.
